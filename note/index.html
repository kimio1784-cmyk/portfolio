<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- noteプロフィール用の短いURL（https://kimio-works.com/note）からトップページへ転送するだけのページ。
       計測はトップページ側のGA4・Cloudflareで行うため、このページには計測タグを入れない（二重計測を防ぐ）。
       検索結果に出さないよう noindex を指定する。 -->
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>きんちゃん｜ポートフォリオへ移動しています</title>
  <!-- JavaScriptが使えない環境でも、すぐに転送する -->
  <meta http-equiv="refresh" content="0; url=https://kimio-works.com/?utm_source=note&amp;utm_medium=social&amp;utm_campaign=profile">
  <script>
    // replace：ブラウザの「戻る」でこのページに戻り、再び転送される繰り返しを防ぐ
    location.replace('https://kimio-works.com/?utm_source=note&utm_medium=social&utm_campaign=profile');
  </script>
</head>
<body>
  <p>ポートフォリオへ移動しています。自動で切り替わらない場合は<a href="https://kimio-works.com/?utm_source=note&amp;utm_medium=social&amp;utm_campaign=profile">こちら</a>を開いてください。</p>
</body>
</html>
